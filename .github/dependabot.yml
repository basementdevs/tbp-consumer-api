version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      devDependencies:
        dependency-type: development
        applies-to: "version-updates"
        patterns:
          - "*"
      dependencies:
        dependency-type: production
        applies-to: "version-updates"
        patterns:
          - "*"

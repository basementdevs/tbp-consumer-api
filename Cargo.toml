[package]
name = "twitch-extension-api"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-cors = "0.7.0"
actix-files = "0.6.6"
actix-test = "0.1.5"
actix-web = { version = "4.9.0", features = ["rustls-0_23"] }
anyhow = "1.0.94"
charybdis = "0.7.2"
chrono = { version = "0.4.39", features = ["serde"] }
colog = "1.3.0"
dotenvy = "0.15.7"
log = "0.4.22"
rustls = "0.23.19"
rustls-pemfile = "2.2.0"
scylla = { version = "0.13.2", features = ["chrono", "time"] }
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
thiserror = "1.0.69"
tokio = { version = "1.42.0", features = ["full"] }
uuid = "1.11.0"

[dev-dependencies]
charybdis-migrate = "0.7.4"
scylladb-dev-toolkit = "0.2.0"
cargo-watch = "8.5.3"
